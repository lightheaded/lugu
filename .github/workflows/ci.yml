name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the release job below may write, and only on main.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The wrapper jar is committed, so prove it is the one Gradle published.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      # Screenshot tests are ordinary JVM unit tests here — Roborazzi renders Compose
      # through Robolectric — so `build` already verifies every baseline against the
      # committed images. There is no separate task and no emulator involved; see
      # docs/qa/screenshots.md for how to re-record after an intentional change.
      - name: Build, test and lint
        run: ./gradlew build --stacktrace

      # A screenshot failure is a picture, and the assertion message is not one. Without
      # this the only way to see what changed is to reproduce it locally, which is the
      # point at which a screenshot suite starts being deleted rather than updated.
      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: '**/build/outputs/roborazzi/**'
          if-no-files-found: ignore

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  # The tests that need Android to be Android: a process that can be reclaimed, a media
  # button with nothing running, and the SQLite build a phone actually ships.
  #
  # This job does NOT gate the release, and that is a deliberate trade rather than a
  # quiet one. The emulator runner is flaky in ways this repository cannot control —
  # AVD boot timeouts and KVM contention on hosted runners — and a release blocked by an
  # emulator that failed to boot is a release nobody publishes. So `release` needs only
  # `build`.
  #
  # What it is NOT is `continue-on-error`. A failure here turns the whole run red and has
  # to be looked at; it simply does not stop an alpha going out. If these start failing
  # for real rather than flaking, the fix is to add `instrumented` to `release`'s
  # `needs:` — not to stop looking.
  instrumented:
    runs-on: ubuntu-latest
    # The emulator can hang *after* a green test run, which is not a failure mode a
    # spinner distinguishes from a slow one. On 16 August the API 26 leg reached BUILD
    # SUCCESSFUL in 2m 12s, ran `adb emu kill`, printed "Wait for emulator (pid 2888) 20
    # seconds to shutdown gracefully before kill" — and then sat there. It never killed
    # it. Two runs did this back to back; the first burned 99 minutes and stopped only
    # because the next push cancelled it, and with no timeout the ceiling is GitHub's
    # default of six hours.
    #
    # A job that has never legitimately needed ten minutes has no business running longer
    # than this. The tests are lost either way when it hangs — the point is that a red X
    # after 20 minutes is a signal, and a spinner after six hours is not.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The two levels that can actually break. 26 is minSdk: it is the oldest Android
        # lugu claims to run on, it is where the background-execution limits the playback
        # service is built around first landed, and its SQLite is the oldest one the
        # migrations have to open on. 36 is current: it is where the newest
        # foreground-service and notification restrictions are, which is where a media
        # session stops being allowed to start itself.
        #
        # Nothing in between is tested, on purpose. The interesting failures are at the
        # ends, and every extra level is another AVD boot on every run.
        #
        # The image differs because the catalogue does. API 26 has a plain `default`
        # x86_64 image; the newer levels are published as `google_apis`, and the Play
        # Services in it are closer to a real phone for a media session anyway.
        #
        # The third leg is the same tests against the *shrunk* build. R8 had been on since
        # 15 August and had never executed anywhere: `assembleRelease` proves only that
        # nothing is missing at compile time, and everything R8 breaks — Room's generated
        # code, Hilt's graph, reflectively resolved serializers, a service the system binds
        # by name — fails at runtime and only in a minified build. One API level is enough
        # for it, because what it catches is a missing keep rule rather than a platform
        # difference, and it goes on the newest because that is where the strictest
        # service and notification rules are.
        include:
          - api-level: 26
            target: default
            variant: debug
            gradle-task: connectedDebugAndroidTest
            gradle-args: ''
          - api-level: 36
            target: google_apis
            variant: debug
            gradle-task: connectedDebugAndroidTest
            gradle-args: ''
          # Only the black-box tests run here, and that is a property of how instrumentation
          # works rather than a choice. The androidTest APK is compiled separately and loaded
          # into the app's process, so a test that names a lugu class cannot resolve it once
          # R8 has renamed that class — which is the whole point of this leg. Those tests run
          # on the debug legs above. What is left answers the question this one exists for:
          # does the app R8 produced still start, build its Hilt graph and draw a screen.
          - api-level: 36
            target: google_apis
            variant: minified
            gradle-task: connectedMinifiedAndroidTest
            gradle-args: '-Plugu.testMinified -Pandroid.testInstrumentationRunnerArguments.annotation=io.github.lightheaded.lugu.BlackBox'
    name: instrumented (${{ matrix.api-level }}, ${{ matrix.target }}, ${{ matrix.variant }})
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      # Hosted runners have KVM but not enabled for the runner user by default, and
      # without it the emulator falls back to software rendering and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # There is deliberately no AVD snapshot cache here. One was, on the stated grounds
      # that "booting an AVD from cold is several minutes". Measured across a dozen runs
      # it is not: creating and booting cold costs 65-69s on API 26 and 94-103s on API 36,
      # against 20-44s to restore the cache. The cache bought about a minute per leg, and
      # both legs run in parallel, so it bought about a minute of wall clock — for 3 GB of
      # storage and a saved machine image restored into whatever emulator the runner ships
      # this week.
      #
      # What it cost was worse than what it saved, twice. One snapshot generation took the
      # API 26 leg down with SIGKILL before Gradle ran at all; the generation that replaced
      # it was in place for both of the runs that hung on shutdown (see the job timeout
      # above). Neither was ever *proved* to be the snapshot's doing — and that is the
      # argument, not a defence of it. A cache worth sixty seconds is not worth being the
      # first suspect every time the emulator misbehaves.
      #
      # One step now, rather than a create-and-cache step followed by a run step: with
      # nothing to restore, the runner creates the AVD on first use.
      # A real Audiobookshelf server, provisioned from nothing, because the tests that
      # matter most have never run. `TestServerConfig` has always been able to read a
      # server out of BuildConfig and skip when there is none — and CI has never had one,
      # so `PlaybackResumptionTest` has skipped on every run since it was written. A test
      # that always skips is a test that does not exist.
      #
      # This deliberately fails the job rather than degrading to a skip. A silent skip is
      # exactly the state being fixed here: it looks green and tests nothing.
      #
      # Its own timeout, because without one it spends the *job's* budget and the job
      # then reads as a mystery cancellation. On 31 August 2026 this step took 12m 49s on
      # the API 36 debug leg while the two legs beside it — same commit, same script, same
      # run — took 33s and 41s. It left 7 minutes for the tests, which finished 43 of them
      # and were cut off mid-suite at the 20 minute cap with nothing failed. Four minutes
      # is about six times the normal cost, so a step that reaches it has stalled on
      # something it fetches rather than merely run slowly. Failing here names the step.
      - name: Seed a test server
        id: abs
        timeout-minutes: 4
        run: |
          command -v ffmpeg >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          }
          scripts/seed-test-server.sh --github-output

      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Read by app/build.gradle.kts into BuildConfig. The emulator reaches the
          # container through 10.0.2.2, which is the host's loopback seen from inside an
          # AVD; the seeding script emits that form rather than localhost for this reason.
          LUGU_DEV_SERVER_URL: ${{ steps.abs.outputs.server-url }}
          LUGU_DEV_USER: ${{ steps.abs.outputs.user }}
          LUGU_DEV_PASS: ${{ steps.abs.outputs.pass }}
          LUGU_TEST_PLAY_QUERY: ${{ steps.abs.outputs.play-query }}
          LUGU_TEST_SERIES_QUERY: ${{ steps.abs.outputs.series-query }}
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Animations make Compose's idling resource wait forever on a transition.
          disable-animations: true
          script: ./gradlew ${{ matrix.gradle-task }} ${{ matrix.gradle-args }} --continue --stacktrace

      # The guard that keeps the step above honest. Every one of these tests skips rather
      # than fails when it cannot find a server, which is right for a developer with no
      # container running and wrong for CI: if the seeding step ever half-works, or the
      # BuildConfig wiring is broken by a rename, the run goes green while testing nothing.
      # That is the failure this whole job was added to end, so it is asserted rather than
      # assumed.
      - name: No test may skip in CI
        if: success()
        run: |
          shopt -s globstar nullglob
          results=(**/build/outputs/androidTest-results/connected/**/*.xml)
          if [ ${#results[@]} -eq 0 ]; then
            echo "::error::No instrumented test results were produced at all."
            exit 1
          fi
          skipped=$(grep -ho '<skipped' "${results[@]}" | wc -l | tr -d ' ')
          if [ "$skipped" != "0" ]; then
            echo "::error::$skipped instrumented test(s) skipped. CI has a server, so a skip means the wiring is broken, not that the test is unrunnable."
            grep -h -B2 '<skipped' "${results[@]}" | head -40
            exit 1
          fi
          echo "No skips across ${#results[@]} result file(s)."

      # Uploaded even on a green run, because "skipped" and "passed" are different answers
      # and the log does not distinguish them at a glance.
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports-api${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/connected/**
            **/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore

  # A testable APK is the point of every green run: an alpha nobody can install
  # is not evidence of anything.
  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags, not just HEAD: the release notes below walk
      # commits back to the previous release tag, which a shallow clone can't see.
      #
      # `fetch-tags` is stated as well as the depth. The two are not the same
      # question, and the notes step fails in a confusing way without the tags: with
      # no tag to walk back to, it describes the last fifty commits instead of the
      # release, and says so in the log.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LUGU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing keystore configured; skipping the release build." >&2
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lugu-release.jks"

      - name: Assemble signed release APK
        env:
          LUGU_KEYSTORE_PATH: ${{ runner.temp }}/lugu-release.jks
          LUGU_KEYSTORE_PASSWORD: ${{ secrets.LUGU_KEYSTORE_PASSWORD }}
          LUGU_KEY_ALIAS: lugu
          LUGU_KEY_PASSWORD: ${{ secrets.LUGU_KEYSTORE_PASSWORD }}
          # Stamps versionName/versionCode; the release tag below must match.
          LUGU_BUILD_NUMBER: ${{ github.run_number }}
          # Canonical copy lives SOPS-encrypted in secrets.enc.yaml; this is the
          # decrypted mirror. Absent secret → empty → crash reporting cannot start.
          LUGU_SENTRY_DSN: ${{ secrets.LUGU_SENTRY_DSN }}
        run: |
          if [ ! -f "$LUGU_KEYSTORE_PATH" ]; then
            echo "No keystore; skipping." >&2
            exit 0
          fi
          ./gradlew :app:assembleRelease --stacktrace
          mv app/build/outputs/apk/release/app-release.apk lugu-latest.apk

          # R8 is on for release, so every stack trace from this build is obfuscated and
          # is unreadable without the mapping file that produced it. The mapping is
          # specific to this one build: keeping only the newest, or the one in the build
          # directory of whoever last built locally, deobfuscates nothing. It is
          # published alongside the APK it belongs to, named with the same version.
          #
          # It is a release asset rather than a Sentry upload deliberately. The Sentry
          # Gradle plugin fails the build outright when it has no auth token, which
          # would mean nobody could build lugu without one.
          #
          # A mapping file is not a secret: it names classes and methods that are already
          # in the APK. It says nothing about the server, the account or the library.
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt lugu-mapping.txt
          else
            echo "No mapping.txt — was R8 turned off?" >&2
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: lugu-apk
          path: lugu-latest.apk
          if-no-files-found: warn

      - name: Upload mapping artifact
        uses: actions/upload-artifact@v7
        with:
          name: lugu-mapping
          path: lugu-mapping.txt
          if-no-files-found: warn

      # Exactly one release per build, tagged with the version the APK actually
      # reports, and marked as the repository's Latest.
      #
      # This replaced a rolling `latest` tag whose asset was clobbered in place. That
      # scheme gave an update tracker nothing that ever changed, and Obtainium fell
      # back to a "pseudo-version" — it could neither tell builds apart nor stop
      # offering the same one. The tag must equal "v" + the installed versionName, or
      # Obtainium cannot reconcile the two and reinstalls on every check.
      #
      # The unchanging download link survives as the release-independent
      # /releases/latest/download/lugu-latest.apk, which --latest keeps pointing here.
      # Releases are deliberately NOT marked --prerelease: a repo whose every release
      # is a prerelease has no Latest at all, which breaks both that link and the
      # tracker's default behaviour. The version string already says alpha.
      - name: Publish alpha release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f lugu-latest.apk ] || exit 0

          # Must agree with app/build.gradle.kts, where versionName is
          # "$versionBase.$LUGU_BUILD_NUMBER". Fail loudly rather than publishing a
          # release tagged ".$RUN" if the variable is ever renamed.
          BASE=$(grep -m1 'val versionBase = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$BASE" ]; then
            echo "Could not read versionBase from app/build.gradle.kts" >&2
            exit 1
          fi
          VERSION="$BASE.${GITHUB_RUN_NUMBER}"

          # Every commit back to the previous release tag, turned into a TL;DR
          # (subject lines) and a detailed section (full bodies, where the actual
          # feature description lives — see AGENTS.md's Releases section). Notes
          # were previously just the install boilerplate below with no feature
          # content at all.
          #
          # On 28 August this step died with `gh: Argument list too long`, exit 126,
          # and no release. What is proved: the notes were passed as one argument, and
          # Linux refuses an argument over 128 KB. What is NOT proved: which range that
          # run used. Both the failing run and the one after it fetched tags, so the
          # obvious explanation — no tag, therefore the whole history at 198 KB — is not
          # supported by the logs, and the failing run printed neither its range nor its
          # size. That is why the two `echo` lines below exist.
          #
          # The range is bounded anyway, because the unbounded fallback is wrong on its
          # own terms: the whole history is not a release note. A tag can go missing for
          # an ordinary reason, because a force push can leave the last release tag
          # unreachable from HEAD, so this must degrade rather than break.
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
            LIMIT=""
          else
            RANGE="HEAD"
            LIMIT="--max-count=50"
            echo "No v* tag is reachable from HEAD. Describing the last 50 commits." >&2
          fi
          echo "Release notes cover $RANGE ${LIMIT:-(no limit)}"

          TLDR=$(git log $LIMIT "$RANGE" --format='- %s' --no-merges)
          DETAILS=$(git log $LIMIT "$RANGE" --format='### %s%n%n%b' --no-merges \
            | grep -v '^Co-Authored-By:' | grep -v '^Claude-Session:')

          # A release body is capped at 125000 characters by the API, so a long run of
          # work has to be cut somewhere. The TL;DR is kept whole, because it names
          # every change. The detail is what gets cut, and the note says so.
          DETAIL_CAP=90000
          if [ "$(printf '%s' "$DETAILS" | wc -c)" -gt "$DETAIL_CAP" ]; then
            DESCRIBED=$(printf '%s' "$DETAILS" | head -c "$DETAIL_CAP")
            DETAILS="$DESCRIBED

          The detail is cut here, because it passed the size a release page holds. Every
          change is named in the TL;DR above, and \`git log $RANGE\` holds the rest."
          fi

          # Written to a file rather than passed as an argument. A note longer than
          # 128 KB cannot be an argument at all: the kernel refuses the exec, and the
          # failure reads as a missing `gh` rather than as an oversized note.
          {
            echo "lugu $VERSION — alpha build from \`${GITHUB_SHA::7}\`."
            echo
            echo "## TL;DR"
            echo "$TLDR"
            echo
            echo "## What changed"
            echo "$DETAILS"
            echo
            echo "Install over any previous lugu build; the signing key is stable."
            echo "Always-current download: https://github.com/lightheaded/lugu/releases/latest/download/lugu-latest.apk"
            echo "Pre-alpha: see the README for what works and what does not."
            echo
            echo "\`lugu-mapping-$VERSION.txt\` is the R8 mapping for this exact build. A stack"
            echo "trace from it is obfuscated and means nothing without it:"
            echo "\`retrace lugu-mapping-$VERSION.txt trace.txt\`."
          } > release-notes.md
          echo "Release notes: $(wc -c < release-notes.md) bytes"

          # Named with the version so that a mapping downloaded next to a crash report
          # cannot be mistaken for the one from a different build. Uploaded in the same
          # command as the APK, so a release never exists without its mapping.
          ASSETS="lugu-latest.apk"
          if [ -f lugu-mapping.txt ]; then
            cp lugu-mapping.txt "lugu-mapping-$VERSION.txt"
            ASSETS="$ASSETS lugu-mapping-$VERSION.txt"
          fi

          gh release create "v$VERSION" $ASSETS \
            --title "lugu $VERSION" --notes-file release-notes.md --latest
