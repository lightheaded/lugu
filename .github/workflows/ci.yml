name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the release job below may write, and only on main.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wrapper jar is committed, so prove it is the one Gradle published.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test and lint
        run: ./gradlew build --stacktrace

  # A testable APK is the point of every green run: an alpha nobody can install
  # is not evidence of anything.
  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LUGU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing keystore configured; skipping the release build." >&2
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lugu-release.jks"

      - name: Assemble signed release APK
        env:
          LUGU_KEYSTORE_PATH: ${{ runner.temp }}/lugu-release.jks
          LUGU_KEYSTORE_PASSWORD: ${{ secrets.LUGU_KEYSTORE_PASSWORD }}
          LUGU_KEY_ALIAS: lugu
          LUGU_KEY_PASSWORD: ${{ secrets.LUGU_KEYSTORE_PASSWORD }}
        run: |
          if [ ! -f "$LUGU_KEYSTORE_PATH" ]; then
            echo "No keystore; skipping." >&2
            exit 0
          fi
          ./gradlew :app:assembleRelease --stacktrace
          mv app/build/outputs/apk/release/app-release.apk lugu-latest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lugu-apk
          path: lugu-latest.apk
          if-no-files-found: warn

      # Rolling "latest" release, so the download link never changes between builds.
      - name: Publish rolling alpha release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f lugu-latest.apk ] || exit 0
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          NOTES="lugu $VERSION — rolling alpha build from \`${GITHUB_SHA::7}\`.
          Install over any previous lugu build; the signing key is stable.
          Pre-alpha: see the README for what works and what does not."
          # Upload in place rather than delete-and-recreate: a run cancelled between
          # the two would leave the download link pointing at nothing.
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "lugu $VERSION (latest)" --notes "$NOTES" --prerelease
          gh release upload latest lugu-latest.apk --clobber
          gh release edit latest --title "lugu $VERSION (latest)" --notes "$NOTES" --prerelease
