name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the release job below may write, and only on main.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The wrapper jar is committed, so prove it is the one Gradle published.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, test and lint
        run: ./gradlew build --stacktrace

  # A testable APK is the point of every green run: an alpha nobody can install
  # is not evidence of anything.
  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LUGU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing keystore configured; skipping the release build." >&2
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lugu-release.jks"

      - name: Assemble signed release APK
        env:
          LUGU_KEYSTORE_PATH: ${{ runner.temp }}/lugu-release.jks
          LUGU_KEYSTORE_PASSWORD: ${{ secrets.LUGU_KEYSTORE_PASSWORD }}
          LUGU_KEY_ALIAS: lugu
          LUGU_KEY_PASSWORD: ${{ secrets.LUGU_KEYSTORE_PASSWORD }}
          # Stamps versionName/versionCode; the release tag below must match.
          LUGU_BUILD_NUMBER: ${{ github.run_number }}
          # Canonical copy lives SOPS-encrypted in secrets.enc.yaml; this is the
          # decrypted mirror. Absent secret → empty → crash reporting cannot start.
          LUGU_SENTRY_DSN: ${{ secrets.LUGU_SENTRY_DSN }}
        run: |
          if [ ! -f "$LUGU_KEYSTORE_PATH" ]; then
            echo "No keystore; skipping." >&2
            exit 0
          fi
          ./gradlew :app:assembleRelease --stacktrace
          mv app/build/outputs/apk/release/app-release.apk lugu-latest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: lugu-apk
          path: lugu-latest.apk
          if-no-files-found: warn

      # Exactly one release per build, tagged with the version the APK actually
      # reports, and marked as the repository's Latest.
      #
      # This replaced a rolling `latest` tag whose asset was clobbered in place. That
      # scheme gave an update tracker nothing that ever changed, and Obtainium fell
      # back to a "pseudo-version" — it could neither tell builds apart nor stop
      # offering the same one. The tag must equal "v" + the installed versionName, or
      # Obtainium cannot reconcile the two and reinstalls on every check.
      #
      # The unchanging download link survives as the release-independent
      # /releases/latest/download/lugu-latest.apk, which --latest keeps pointing here.
      # Releases are deliberately NOT marked --prerelease: a repo whose every release
      # is a prerelease has no Latest at all, which breaks both that link and the
      # tracker's default behaviour. The version string already says alpha.
      - name: Publish alpha release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f lugu-latest.apk ] || exit 0

          # Must agree with app/build.gradle.kts, where versionName is
          # "$versionBase.$LUGU_BUILD_NUMBER". Fail loudly rather than publishing a
          # release tagged ".$RUN" if the variable is ever renamed.
          BASE=$(grep -m1 'val versionBase = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$BASE" ]; then
            echo "Could not read versionBase from app/build.gradle.kts" >&2
            exit 1
          fi
          VERSION="$BASE.${GITHUB_RUN_NUMBER}"

          NOTES="lugu $VERSION — alpha build from \`${GITHUB_SHA::7}\`.

          Install over any previous lugu build; the signing key is stable.
          Always-current download: https://github.com/lightheaded/lugu/releases/latest/download/lugu-latest.apk
          Pre-alpha: see the README for what works and what does not."

          gh release create "v$VERSION" lugu-latest.apk \
            --title "lugu $VERSION" --notes "$NOTES" --latest
